name: Validate Curve
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: curve_test
          POSTGRES_USER: curve_test
          POSTGRES_PASSWORD: curve_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U curve_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --test-concurrency=1
        env:
          CURVE_TEST_DATABASE_URL: postgresql://curve_test:curve_test@127.0.0.1:5432/curve_test
      - run: npm run build
